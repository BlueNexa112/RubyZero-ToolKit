<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake · ToolKit</title>
<style>
:root{--bg:#0a1408;--card:#101e0c;--fg:#d4ffcf;--mut:#5a8a52;--acc:#6ee76e;--acc2:#f5d547;--line:rgba(110,231,110,.25)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#142a12,#0a1408 65%);color:var(--fg);min-height:100dvh;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700}
.hud{display:flex;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.hud span{font-size:11px;color:var(--mut);letter-spacing:.5px;text-align:center;flex:1}
.hud b{display:block;color:var(--acc);font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#050d05;box-shadow:inset 0 0 40px rgba(110,231,110,.06)}
canvas{display:block;width:100%;aspect-ratio:1/1}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,13,5,.9);backdrop-filter:blur(8px);text-align:center;padding:20px;z-index:5}
.ov h2{font-size:24px;margin-bottom:8px;color:var(--acc);text-shadow:0 0 20px rgba(110,231,110,.5)}
.ov p{color:var(--mut);font-size:13px;margin-bottom:16px}
.btn{padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#3dbd3d);color:#0a1408;font-size:15px;font-weight:800;border:none;font-family:inherit;box-shadow:0 8px 24px rgba(110,231,110,.35)}
.btn:active{transform:scale(.97)}

/* ===== D-PAD CROSS LAYOUT ===== */
.dpad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:8px;
  max-width:230px;
  margin:16px auto 0;
}
.dpad .sp{opacity:0;pointer-events:none;visibility:hidden}
.dpad button{
  height:58px;border-radius:16px;
  border:1px solid var(--line);
  background:var(--card);color:var(--acc);
  font-size:24px;font-weight:800;font-family:inherit;
  display:grid;place-items:center;
}
.dpad button:active{background:var(--acc);color:#0a1408;transform:scale(.94)}
/* Atur posisi cross:
   row1: [sp]  [U]  [sp]
   row2: [L]   [sp] [R]
   row3: [sp]  [D]  [sp] */
.dpad button[data-d="U"]{grid-column:2;grid-row:1}
.dpad button[data-d="L"]{grid-column:1;grid-row:2}
.dpad button[data-d="R"]{grid-column:3;grid-row:2}
.dpad button[data-d="D"]{grid-column:2;grid-row:3}
</style></head><body>
<div class="top"><a class="back" href="../game.html">←</a><h1>Snake</h1></div>
<div class="hud">
<span>SKOR<b id="sc">0</b></span><span>PANJANG<b id="ln">3</b></span><span>HIGH<b id="hi">0</b></span>
</div>
<div class="wrap">
<canvas id="cv"></canvas>
<div class="ov" id="ov">
<div><h2 id="ot">Snake</h2><p id="op">Tap tombol arah untuk bergerak</p><button class="btn" id="ob">▶ Mulai</button></div>
</div>
</div>
<!-- D-pad: ↑ / ← → / ↓ -->
<div class="dpad">
  <button class="sp"></button>
  <button data-d="U">▲</button>
  <button class="sp"></button>
  <button data-d="L">◀</button>
  <button class="sp"></button>
  <button data-d="R">▶</button>
  <button class="sp"></button>
  <button data-d="D">▼</button>
  <button class="sp"></button>
</div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var G=20,cell,snake,dir,nd,food,score,alive,loop,speed,frame;
var hi=+(localStorage.getItem('snake2_hi')||0);
function size(){var r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cell=r.width/G}
function reset(){snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir={x:1,y:0};nd={x:1,y:0};score=0;speed=130;frame=0;place();upd();alive=true}
function place(){do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)}}while(snake.some(function(s){return s.x===food.x&&s.y===food.y}))}
function upd(){document.getElementById('sc').textContent=score;document.getElementById('ln').textContent=snake.length;document.getElementById('hi').textContent=hi}
function draw(){
  var w=cv.clientWidth;
  ctx.fillStyle='#050d05';ctx.fillRect(0,0,w,w);
  ctx.strokeStyle='rgba(110,231,110,.06)';ctx.lineWidth=1;
  for(var i=0;i<=G;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,w);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke()}
  ctx.shadowColor='#f5d547';ctx.shadowBlur=18;
  ctx.fillStyle='#f5d547';ctx.beginPath();ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.34,0,7);ctx.fill();
  ctx.shadowBlur=0;
  snake.forEach(function(s,i){
    var c=i===0?'#6ee76e':'#3dbd3d';
    ctx.shadowColor=c;ctx.shadowBlur=i===0?16:6;
    ctx.fillStyle=c;ctx.beginPath();
    var pad=i===0?1:2;
    if(ctx.roundRect){ctx.roundRect(s.x*cell+pad,s.y*cell+pad,cell-pad*2,cell-pad*2,i===0?6:4)}else{ctx.rect(s.x*cell+pad,s.y*cell+pad,cell-pad*2,cell-pad*2)}
    ctx.fill();
  });
  ctx.shadowBlur=0;
}
function step(){
  dir=nd;
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=G||h.y>=G||snake.some(function(s){return s.x===h.x&&s.y===h.y}))return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score+=10;if(score>hi){hi=score;localStorage.setItem('snake2_hi',hi)}place();SFX.pickup();if(navigator.vibrate)navigator.vibrate(15)}
  else snake.pop();
  upd();draw();
}
function over(){alive=false;clearInterval(loop);SFX.lose();if(navigator.vibrate)navigator.vibrate([100,60,100]);
  document.getElementById('ot').textContent='Game Over';
  document.getElementById('op').textContent='Skor: '+score+' • High: '+hi;
  document.getElementById('ob').textContent='⟲ Main Lagi';
  document.getElementById('ov').style.display='grid';
}
function tick(){
  if(!alive)return;
  step();frame++;
  if(frame%60===0&&speed>65){speed-=6;clearInterval(loop);loop=setInterval(tick,speed)}
}
function start(){reset();document.getElementById('ov').style.display='none';SFX.ok();
  clearInterval(loop);loop=setInterval(tick,speed);}
document.getElementById('ob').addEventListener('click',start);
document.querySelectorAll('.dpad button[data-d]').forEach(function(b){
  b.addEventListener('click',function(){
    if(!alive)return;var d=b.dataset.d;SFX.tap();
    if(d==='U'&&dir.y!==1)nd={x:0,y:-1};
    if(d==='D'&&dir.y!==-1)nd={x:0,y:1};
    if(d==='L'&&dir.x!==1)nd={x:-1,y:0};
    if(d==='R'&&dir.x!==-1)nd={x:1,y:0};
  });
});
window.addEventListener('resize',function(){size();draw()});
size();reset();alive=false;draw();
})();
</script></body></html>
